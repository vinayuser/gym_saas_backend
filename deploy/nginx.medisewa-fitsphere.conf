# FitSphere on the VM public IP. Not part of medisewa.in.
# Install as its own site, for example:
#   sudo cp backend/deploy/nginx.medisewa-fitsphere.conf /etc/nginx/sites-available/fitsphere
#   sudo ln -sf /etc/nginx/sites-available/fitsphere /etc/nginx/sites-enabled/fitsphere
#   sudo nginx -t && sudo systemctl reload nginx
#
# App:  http://144.24.124.125/fitsphere/
# API:  http://144.24.124.125/fitsphere/api/v1/
# Frontend container :8081, API container :5010

server {
    listen 80;
    listen [::]:80;
    server_name 144.24.124.125;

    client_max_body_size 30m;

    location = /fitsphere {
        return 301 /fitsphere/;
    }

    location /fitsphere/api/ {
        proxy_pass http://127.0.0.1:5010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /fitsphere/socket.io/ {
        proxy_pass http://127.0.0.1:5010/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /fitsphere/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
