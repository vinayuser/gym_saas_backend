name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-gym-backend
  cancel-in-progress: true

env:
  IMAGE_LOCAL: gym-saas-backend:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ${{ env.IMAGE_LOCAL }} .

      - name: Deploy to Oracle
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          USER: ${{ secrets.ORACLE_USER }}
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          APP_HOME: ${{ secrets.ORACLE_APP_HOME }}
          IMAGE_LOCAL: ${{ env.IMAGE_LOCAL }}
        run: |
          set -euo pipefail

          : "${HOST:?ORACLE_HOST secret is required}"
          : "${USER:?ORACLE_USER secret is required}"
          : "${SSH_KEY:?ORACLE_SSH_KEY secret is required}"
          : "${BACKEND_ENV:?BACKEND_ENV secret is required}"

          PORT=22
          APP_HOME="${APP_HOME:-/opt/gym-saas-backend}"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH=(ssh -i ~/.ssh/oracle_key -p "$PORT" -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i ~/.ssh/oracle_key -P "$PORT" -o StrictHostKeyChecking=accept-new)

          "${SSH[@]}" "${USER}@${HOST}" "sudo mkdir -p '${APP_HOME}' && sudo chown -R '${USER}:${USER}' '${APP_HOME}'"
          "${SCP[@]}" docker-compose.yml "${USER}@${HOST}:${APP_HOME}/docker-compose.yml"
          printf '%s\n' "$BACKEND_ENV" > /tmp/backend.env
          "${SCP[@]}" /tmp/backend.env "${USER}@${HOST}:${APP_HOME}/.env"
          rm -f /tmp/backend.env

          echo "Transferring backend image..."
          docker save "${IMAGE_LOCAL}" | gzip | \
            "${SSH[@]}" "${USER}@${HOST}" "gunzip | docker load"

          "${SSH[@]}" "${USER}@${HOST}" bash -s <<EOF
          set -euo pipefail
          cd '${APP_HOME}'
          export IMAGE='${IMAGE_LOCAL}'
          docker compose up -d --remove-orphans --force-recreate
          docker image prune -f
          docker ps --filter name=gym-saas-
          curl -sS -o /dev/null -w 'health:%{http_code}\n' http://127.0.0.1:5010/api/v1/health || true
          EOF
